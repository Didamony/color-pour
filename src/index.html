<title>Color Pour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>/*@CSS@*/</style>

<div id="app" class="bg-cloud">
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="board" aria-label="Game board"></canvas>

  <header class="topbar">
    <button class="icon-btn" id="btn-home" data-icon="home" data-i18n-label="home"></button>
    <div class="level-head">
      <div class="level-title" id="level-title">Level 1</div>
      <div class="level-sub"><span id="moves" class="num"></span><span id="level-tag" class="tag" hidden></span></div>
    </div>
    <button class="coins" id="coins-pill"><i class="coin" aria-hidden="true"></i><span class="num" data-coins>0</span></button>
    <button class="icon-btn" id="btn-settings" data-icon="gear" data-i18n-label="settings"></button>
    <div class="duel-bar" id="duel-bar" hidden>
      <div class="pchip me"><b dir="auto"></b><span class="pbar"><span class="fill"></span></span></div>
      <span class="vs">VS</span>
      <div class="pchip opp"><b dir="auto"></b><span class="pbar"><span class="fill"></span></span></div>
    </div>
  </header>

  <nav class="toolbar">
    <button class="tool" id="btn-undo" data-icon="undo"><span data-i18n="undo">Undo</span><span class="count"></span></button>
    <button class="tool" id="btn-restart" data-icon="restart"><span data-i18n="restart">Restart</span></button>
    <button class="tool" id="btn-tube" data-icon="tube"><span data-i18n="addTube">Tube</span><span class="count"></span></button>
    <button class="tool" id="btn-hint" data-icon="bulb"><span data-i18n="hint">Hint</span><span class="count"></span></button>
    <button class="tool" id="btn-emote" data-icon="chat" hidden><span data-i18n="emotes">Emotes</span></button>
  </nav>

  <div class="bubble" id="bubble" hidden></div>

  <section class="screen" id="home">
    <div class="home-inner">
      <div class="home-top">
        <button class="coins res" id="home-coins"><i class="coin" aria-hidden="true"></i><span class="num" data-coins>0</span><span class="plus" aria-hidden="true">+</span></button>
        <div class="right">
          <button class="icon-btn gift-btn" id="gift-btn" data-icon="gift" data-i18n-label="giftTitle"><span class="dot" id="gift-dot" hidden></span></button>
          <button class="icon-btn" id="home-settings" data-icon="gear" data-i18n-label="settings"></button>
        </div>
      </div>

      <div class="stage">
        <div class="side">
          <button class="rbtn r-orange" id="tile-daily"><span class="orb" data-icon="cal"></span><span class="rlabel" data-i18n="dailyShort">Challenge</span><span class="badge" id="daily-badge">!</span></button>
          <button class="rbtn r-violet" id="tile-wheel"><span class="orb" data-icon="wheel"></span><span class="rlabel" data-i18n="wheelShort">Wheel</span><span class="badge" id="wheel-badge">1</span></button>
        </div>
        <canvas id="hero" aria-hidden="true"></canvas>
        <div class="side">
          <button class="rbtn r-pink" id="tile-shop"><span class="orb" data-icon="bag"></span><span class="rlabel" data-i18n="shopTitle">Shop</span></button>
          <button class="rbtn r-blue" id="tile-levels"><span class="orb" data-icon="grid"></span><span class="rlabel" data-i18n="levelsTitle">Levels</span></button>
        </div>
      </div>

      <div class="title-block">
        <h1 class="logo" data-i18n="appName">Color Pour</h1>
        <p class="tagline" data-i18n="tagline">Pour, sort, relax</p>
      </div>

      <div class="road" id="road" aria-hidden="true"></div>

      <button class="play-btn" id="play-btn"><span class="play-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg></span><span class="play-tx"><b data-i18n="play">Play</b><span id="play-level" class="num">Level 1</span></span></button>

      <button class="friends-btn" id="tile-friends"><span class="fr-ic" data-icon="users"></span><span class="fr-tx"><b data-i18n="duelTile">Play with a friend</b><small data-i18n="duelTileSub">Live race with emotes</small></span><span class="badge" data-i18n="newBadge">New</span></button>
    </div>
  </section>

  <div class="emote-layer" id="emote-layer" aria-live="polite"></div>
  <div class="emote-panel" id="emote-panel" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>/*@JS@*/</script>
