<title>Color Pour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>/*@CSS@*/</style>

<div id="app" class="bg-cloud">
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="board" aria-label="Game board"></canvas>

  <header class="topbar">
    <button class="icon-btn" id="btn-home" data-icon="home" data-i18n-label="home"></button>
    <div class="level-head">
      <div class="level-title" id="level-title">Level 1</div>
      <div class="level-sub"><span id="moves" class="num"></span><span id="level-tag" class="tag" hidden></span></div>
    </div>
    <button class="coins" id="coins-pill"><i class="coin" aria-hidden="true"></i><span class="num" data-coins>0</span></button>
    <button class="icon-btn" id="btn-settings" data-icon="gear" data-i18n-label="settings"></button>
    <div class="duel-bar" id="duel-bar" hidden>
      <div class="pchip me"><b dir="auto"></b><span class="pbar"><span class="fill"></span></span></div>
      <span class="vs">VS</span>
      <div class="pchip opp"><b dir="auto"></b><span class="pbar"><span class="fill"></span></span></div>
    </div>
  </header>

  <nav class="toolbar">
    <button class="tool" id="btn-undo" data-icon="undo"><span data-i18n="undo">Undo</span><span class="count"></span></button>
    <button class="tool" id="btn-restart" data-icon="restart"><span data-i18n="restart">Restart</span></button>
    <button class="tool" id="btn-tube" data-icon="tube"><span data-i18n="addTube">Tube</span><span class="count"></span></button>
    <button class="tool" id="btn-hint" data-icon="bulb"><span data-i18n="hint">Hint</span><span class="count"></span></button>
    <button class="tool" id="btn-emote" data-icon="chat" hidden><span data-i18n="emotes">Emotes</span></button>
  </nav>

  <div class="bubble" id="bubble" hidden></div>

  <section class="screen" id="home">
    <div class="home-inner">
      <div class="home-bg" id="home-bg" aria-hidden="true"></div>
      <canvas id="hero" aria-hidden="true"></canvas>

      <div class="hud">
        <button class="avatar-btn" id="home-avatar" data-i18n-label="settings">
          <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="12" fill="#FFB8DC"/><rect x="15" y="6" width="18" height="40" rx="9" fill="#FFFFFF" opacity=".75"/><path d="M15 22h18v15a9 9 0 0 1-18 0z" fill="#FF4FA3"/><path d="M15 22h18v4H15z" fill="#FF8AC4"/><circle cx="20.5" cy="31" r="2.6" fill="#24123F"/><circle cx="27.5" cy="31" r="2.6" fill="#24123F"/><circle cx="21.3" cy="30.1" r=".9" fill="#fff"/><circle cx="28.3" cy="30.1" r=".9" fill="#fff"/><path d="M21.5 35.2q2.5 2.4 5 0" stroke="#24123F" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="13" y="5" width="22" height="4" rx="2" fill="#FFFFFF"/></svg>
        </button>
        <button class="pill" id="home-coins"><i class="coin" aria-hidden="true"></i><span class="num" data-coins>0</span><span class="plus" aria-hidden="true">+</span></button>
        <button class="pill" id="home-stars-pill"><i class="pstar" aria-hidden="true">★</i><span class="num" id="home-stars">0</span></button>
        <button class="gear-btn" id="home-settings" data-icon="gear" data-i18n-label="settings"></button>
      </div>

      <div class="title-block">
        <div class="logo-frame">
          <h1 class="logo">Color Pour</h1>
          <svg class="logo-flask" viewBox="0 0 48 64" aria-hidden="true"><path d="M17 4h14v14l12 22a14 14 0 0 1-12 21H17A14 14 0 0 1 5 40l12-22z" fill="#FFFFFF" fill-opacity=".55" stroke="#FFFFFF" stroke-width="2.5"/><path d="M8.5 38h31l2 4a12 12 0 0 1-10.5 17H17A12 12 0 0 1 6.5 42z" fill="#FF4FA3"/><path d="M8.5 38h31l1 2H7.5z" fill="#FF9BCF"/><circle cx="20" cy="47" r="2.4" fill="#24123F"/><circle cx="28" cy="47" r="2.4" fill="#24123F"/><path d="M21.5 51.5q2.5 2.2 5 0" stroke="#24123F" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="14" y="0" width="20" height="7" rx="3" fill="#D59C68"/><circle cx="38" cy="16" r="3" fill="#FFFFFF" opacity=".8"/><circle cx="43" cy="26" r="2" fill="#FFFFFF" opacity=".7"/></svg>
        </div>
      </div>

      <div class="stage" id="stage">
        <button class="side-btn" id="gift-btn" data-i18n-label="giftTitle">
          <span class="disc"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="20" width="34" height="22" rx="4" fill="#FF4F6E"/><rect x="5" y="14" width="38" height="10" rx="4" fill="#FF7189"/><rect x="21" y="14" width="6" height="28" fill="#FFD23F"/><path d="M24 14c-3-7-11-9-12-4s6 5 12 4zm0 0c3-7 11-9 12-4s-6 5-12 4z" fill="#FFD23F" stroke="#E8A800" stroke-width="1.5"/><rect x="7" y="24" width="34" height="3" fill="#000" opacity=".1"/></svg></span>
          <span class="ribbon" data-i18n="giftTitle">Daily gift</span>
          <span class="dot" id="gift-dot" hidden></span>
        </button>
        <button class="side-btn" id="tile-daily">
          <span class="disc"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="22" cy="26" r="17" fill="#FFFFFF"/><circle cx="22" cy="26" r="13" fill="#FF4F6E"/><circle cx="22" cy="26" r="9" fill="#FFFFFF"/><circle cx="22" cy="26" r="5" fill="#FF4F6E"/><path d="M22 26L41 7" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round"/><path d="M37 4l7 1-1 7-5-3z" fill="#FFD23F"/><path d="M37 11l5 2" stroke="#FFD23F" stroke-width="3" stroke-linecap="round"/></svg></span>
          <span class="ribbon" data-i18n="dailyShort">Challenge</span>
          <span class="dot" id="daily-badge">!</span>
        </button>
      </div>

      <button class="level-btn" id="play-btn"><span id="play-level" class="num">Level 1</span></button>

      <nav class="tabbar">
        <button class="tab-it" id="tile-shop"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="20" width="32" height="22" rx="3" fill="#9B6BFF"/><rect x="17" y="27" width="14" height="15" rx="2" fill="#5B2BD9"/><path d="M5 12h38l-2 10H7z" fill="#FFFFFF"/><path d="M5 12h7.6l-1 10H7zM20.2 12h7.6l-.4 10h-6.8zM35.4 12H43l-2 10h-6.6z" fill="#FF4FA3"/><path d="M7 22a3.3 3.3 0 0 0 6.6 0 3.3 3.3 0 0 0 6.8 0 3.3 3.3 0 0 0 6.8 0 3.3 3.3 0 0 0 6.8 0 3.3 3.3 0 0 0 6.6 0z" fill="#FF4FA3"/><rect x="4" y="8" width="40" height="5" rx="2.5" fill="#FFD23F"/></svg><span data-i18n="shopTitle">Shop</span></button>
        <button class="tab-it" id="tile-friends"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M4 42c0-8 5-13 12-13s12 5 12 13z" fill="#4FC3FF"/><circle cx="16" cy="19" r="9" fill="#FFD9B8"/><path d="M7 18c0-7 5-10 9-10s9 3 9 9c-4 0-8-2-9-5-1 3-5 6-9 6z" fill="#6B4226"/><path d="M20 42c0-8 5-13 12-13s12 5 12 13z" fill="#FF6FAE"/><circle cx="32" cy="20" r="8.5" fill="#F7C9A0"/><path d="M23.5 19c0-6 4-10 8.5-10s8.5 4 8.5 9.5c-3 1-6-1-8-4-2 3-5 5-9 4.5z" fill="#2B1A12"/><circle cx="13" cy="20" r="1.3" fill="#24123F"/><circle cx="19" cy="20" r="1.3" fill="#24123F"/><circle cx="29" cy="21" r="1.3" fill="#24123F"/><circle cx="35" cy="21" r="1.3" fill="#24123F"/></svg><span data-i18n="friends">Friends</span><span class="badge" data-i18n="newBadge">New</span></button>
        <button class="tab-it home-tab" id="tab-home" aria-current="page"><svg viewBox="0 0 48 64" aria-hidden="true"><path d="M17 6h14v14l11 20a13 13 0 0 1-11 19H17A13 13 0 0 1 6 40l11-20z" fill="#FFFFFF" fill-opacity=".6" stroke="#FFFFFF" stroke-width="2.5"/><path d="M9 38h30l2 4a11 11 0 0 1-10 15H17A11 11 0 0 1 7 42z" fill="#4FDB6E"/><path d="M9 38h30l1 2H8z" fill="#A6F0B4"/><circle cx="20" cy="46" r="2.4" fill="#24123F"/><circle cx="28" cy="46" r="2.4" fill="#24123F"/><path d="M21.5 50.5q2.5 2.2 5 0" stroke="#24123F" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="14" y="2" width="20" height="7" rx="3" fill="#D59C68"/></svg><span data-i18n="home">Home</span></button>
        <button class="tab-it" id="tile-levels"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M4 12l13-5 14 5 13-5v30l-13 5-14-5-13 5z" fill="#FFE8B0"/><path d="M17 7v30M31 12v30" stroke="#E5C27A" stroke-width="2"/><path d="M6 30c6-6 10 2 16-2s8-8 14-4 6 6 6 6v7l-11 4-14-5-11 4z" fill="#7BD88F" opacity=".9"/><path d="M33 8c-5 0-8 3.6-8 8 0 6 8 13 8 13s8-7 8-13c0-4.4-3-8-8-8z" fill="#FF4F6E"/><circle cx="33" cy="16" r="3.2" fill="#FFFFFF"/></svg><span data-i18n="levelsTitle">Levels</span></button>
        <button class="tab-it" id="tile-wheel"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="26" r="19" fill="#FFD23F"/><g transform="translate(24 26)"><path d="M0 0L0-16A16 16 0 0 1 13.9-8z" fill="#FF4FA3"/><path d="M0 0L13.9-8A16 16 0 0 1 13.9 8z" fill="#4FC3FF"/><path d="M0 0L13.9 8A16 16 0 0 1 0 16z" fill="#4FDB6E"/><path d="M0 0L0 16A16 16 0 0 1-13.9 8z" fill="#FF9A2E"/><path d="M0 0L-13.9 8A16 16 0 0 1-13.9-8z" fill="#A35CFF"/><path d="M0 0L-13.9-8A16 16 0 0 1 0-16z" fill="#FF4F6E"/></g><circle cx="24" cy="26" r="4" fill="#FFFFFF" stroke="#E8A800" stroke-width="2"/><path d="M24 12l-4-8h8z" fill="#FFFFFF" stroke="#5B2BD9" stroke-width="1.5"/></svg><span data-i18n="wheelShort">Wheel</span><span class="badge" id="wheel-badge">1</span></button>
      </nav>
    </div>
  </section>

  <div class="emote-layer" id="emote-layer" aria-live="polite"></div>
  <div class="emote-panel" id="emote-panel" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>/*@JS@*/</script>
